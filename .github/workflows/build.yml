name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux amd64: native
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: lc-linux-amd64
          # linux arm64: cross-compile from ubuntu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: lc-linux-arm64
            cross: aarch64-linux-gnu-gcc
          # macos amd64: cross-compile from macos arm runner
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: lc-macos-amd64
          # macos arm64: native
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: lc-macos-arm64
          # windows amd64: native
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lc-windows-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-linker (linux arm64)
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_CC: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR: aarch64-linux-gnu-ar

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/stage
          cp target/${{ matrix.target }}/release/lc dist/stage/
          cp README.md dist/stage/
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            mkdir dist/stage/systemd
            cp packaging/systemd/lc.service packaging/systemd/lc.env.example dist/stage/systemd/
          fi
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist/stage .
          sha256sum dist/${{ matrix.artifact }}.tar.gz > dist/${{ matrix.artifact }}.tar.gz.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/lc.exe -DestinationPath dist/${{ matrix.artifact }}.zip
          $h = (Get-FileHash dist/${{ matrix.artifact }}.zip -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii dist/${{ matrix.artifact }}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
